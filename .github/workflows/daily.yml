name: Daily water update

on:
  schedule:
    - cron: "23 14 * * *"   # 14:23 UTC = 6:23 am PST / 7:23 am PDT
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-water
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ github.workspace }}/data-store
      API_USGS_PAT: ${{ secrets.API_USGS_PAT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore data branch
        run: |
          git clone --depth 1 --branch data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-store \
            || mkdir -p data-store

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Run pipeline
        run: Rscript run_pipeline.R

      - name: Render dashboard
        run: |
          quarto render dashboard/index.qmd
          mkdir -p _site && cp dashboard/index.html _site/index.html

      - name: Save data branch
        run: |
          cd data-store
          rm -rf .git
          git init -q -b data
          git config user.name "tracking-water-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Data as of $(date -u +%F)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Open issue for new alerts
        if: hashFiles('data-store/new_alerts.md') != ''
        run: gh issue create --title "Water alert $(date -u +%F)" --body-file data-store/new_alerts.md

      - name: Keep dashboard as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: _site/index.html
          retention-days: 14

      - name: Publish to GitHub Pages
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
